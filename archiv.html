<meta name="viewport" content="width=device-width, initial-scale=1">
<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="var(--color-current-sub)">

    <title>Archiv | Theater Eibesthal</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <script defer src="js/stuecke.js"></script>
    <script defer src="js/main.js"></script>
  </head>

  <body>
    <div id="header"></div>
    <section class="container section center">
      <h1>Archiv</h1>
      <div class="jahr-filter-wrapper">
        <button class="scroll-btn left" type="button">❮</button>
        <div id="jahr-filter"></div>
        <button class="scroll-btn right" type="button">❯</button>
        <div class="mobile-scroll-hint">
          <span>⟵</span>
          <span>⟶</span>    
        </div>
      </div>
      <div id="archiv-grid"></div>
    </section>

    <div id="footer"></div>

    <div id="lightbox">
      <button class="close">✕</button>
      <button class="prev">❮</button>
      <img src="">
      <button class="next">❯</button>
    </div>
  </body>
</html>
